<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>판매시세 현황 | 광성당</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />

<style>
  :root {
    --bg: #f6f0e6;
    --paper: #fffdf7;
    --ink: #1f1a17;
    --ink-soft: #4a3f30;
    --ink-muted: #7b6e58;
    --gold: #b08a3c;
    --gold-deep: #8a6a2c;
    --line: #d9cdb1;
    --line-soft: #e8dec6;
    --font-display: 'Nanum Myeongjo', 'Noto Serif KR', serif;
    --font-serif: 'Noto Serif KR', 'Nanum Myeongjo', serif;
    --font-body: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--bg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    min-height: 100vh;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 64px;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  .header img {
    height: 48px;
    width: auto;
    margin: 0 auto 20px;
  }

  .header h1 {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--ink);
  }

  .header p {
    margin-top: 8px;
    font-family: var(--font-serif);
    font-size: 14px;
    color: var(--ink-muted);
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(60, 40, 10, 0.06);
  }

  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-serif);
    font-size: 15px;
  }

  thead th {
    background: var(--bg);
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    padding: 14px 16px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }

  thead th:first-child { text-align: left; }

  tbody td {
    padding: 18px 16px;
    text-align: center;
    border-bottom: 1px solid var(--line-soft);
    vertical-align: middle;
  }

  tbody td:first-child {
    text-align: left;
    font-weight: 600;
    color: var(--gold-deep);
    white-space: nowrap;
  }

  tbody tr:last-child td { border-bottom: 0; }

  .num { font-variant-numeric: tabular-nums; }

  .change.up, .rate.up { color: #b83a3a; }
  .change.down, .rate.down { color: #2e6db4; }
  .change.flat, .rate.flat { color: var(--ink-muted); }

  .footer-note {
    margin-top: 20px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-muted);
    font-family: var(--font-serif);
  }

  .loading, .error {
    padding: 48px 24px;
    text-align: center;
    font-family: var(--font-serif);
    color: var(--ink-muted);
    font-size: 14px;
  }

  .error { display: none; }

  @media (max-width: 560px) {
    .page { padding: 32px 16px 48px; }
    .header h1 { font-size: 20px; }
    thead th, tbody td { padding: 12px 10px; font-size: 13px; }
    thead th { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="page">
  <header class="header">
    <img src="../assets/logo-mark.png" alt="광성당" />
    <h1>판매시세 현황</h1>
    <p>금·은 매매 기준 시세</p>
  </header>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>구분</th>
            <th>원/g</th>
            <th>원/돈(3.75g)</th>
            <th>전일대비</th>
            <th>등락률</th>
          </tr>
        </thead>
        <tbody id="price-body">
          <tr><td colspan="5" class="loading">시세 불러오는 중…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <p class="footer-note" id="price-note"></p>
  <p class="error" id="price-error">시세 정보를 불러올 수 없습니다.</p>
</div>

<script>
(function () {
  var bodyEl = document.getElementById('price-body');
  var noteEl = document.getElementById('price-note');
  var errorEl = document.getElementById('price-error');

  function formatWon(value) {
    return '₩' + Math.round(value).toLocaleString('ko-KR');
  }

  function getDirection(rate) {
    if (rate > 0) return 'up';
    if (rate < 0) return 'down';
    return 'flat';
  }

  function formatChange(change, rate) {
    var dir = getDirection(rate);
    var arrow = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '━';
    var amount = Math.round(Math.abs(change)).toLocaleString('ko-KR');
    return '<span class="change ' + dir + '">' + arrow + ' ' + amount + '</span>';
  }

  function formatRate(rate) {
    var dir = getDirection(rate);
    var sign = rate > 0 ? '+' : rate < 0 ? '-' : '';
    return '<span class="rate ' + dir + '">' + sign + Math.abs(rate).toFixed(2) + '%</span>';
  }

  function buildRow(label, quote) {
    return (
      '<tr>' +
        '<td>' + label + '</td>' +
        '<td class="num">' + formatWon(quote.perGram) + '</td>' +
        '<td class="num">' + formatWon(quote.perDon) + '</td>' +
        '<td class="num">' + formatChange(quote.change, quote.changeRate) + '</td>' +
        '<td class="num">' + formatRate(quote.changeRate) + '</td>' +
      '</tr>'
    );
  }

  function formatTime(iso) {
    return new Date(iso).toLocaleTimeString('ko-KR', {
      timeZone: 'Asia/Seoul',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false,
    });
  }

  fetch('/api/gold-price')
    .then(function (res) {
      if (!res.ok) throw new Error('fetch failed');
      return res.json();
    })
    .then(function (data) {
      if (!data.gold || !data.silver) throw new Error('invalid payload');

      bodyEl.innerHTML =
        buildRow('순금 (KRX)', data.gold) +
        buildRow('은', data.silver);

      noteEl.textContent = '기준: 네이버 KRX · 갱신 ' + formatTime(data.updatedAt) + ' (KST)';
    })
    .catch(function () {
      bodyEl.innerHTML = '';
      errorEl.style.display = 'block';
    });
})();
</script>

</body>
</html>
